      x-docs-slug: context-management/unassign-group
    patch:
      operationId: reorderContextGroup
      summary: Reorder a context group
      description: Moves the assigned group to a new zero-based position. Requires `org:context:write`.
      security:
      - BearerAuth: []
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Project ID.
        required: true
        description: Project ID.
        name: projectId
        in: path
      - schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Context group ID.
        required: true
        description: Context group ID.
        name: groupId
        in: path
      - schema:
          $ref: '#/components/schemas/ApiVersion'
        required: false
        description: API contract version. Defaults to the oldest supported version.
        name: gt-api-version
        in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetIndex:
                  type: integer
                  description: Zero-based position; out-of-range values move the group to the first or last position.
              required:
              - targetIndex
              additionalProperties: false
      responses:
