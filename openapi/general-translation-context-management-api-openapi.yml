        name: projectId
        in: path
      - schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Context group ID.
        required: true
        description: Context group ID.
        name: groupId
        in: path
      - schema:
          $ref: '#/components/schemas/ApiVersion'
        required: false
        description: API contract version. Defaults to the oldest supported version.
        name: gt-api-version
        in: header
      responses:
        '200':
          description: Already assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  committed:
                    type: boolean
                    enum:
                    - true
                  created:
                    type: boolean
                    description: False when the group was already assigned; nothing changed.
                required:
                - committed
                - created
        '201':
          description: Context group assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  committed:
                    type: boolean
