    patch:
      operationId: updateContextGroup
      summary: Update a context group
      description: Renames the group. The name is the only editable field. Requires `org:context:write`.
      security:
      - BearerAuth: []
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 128
