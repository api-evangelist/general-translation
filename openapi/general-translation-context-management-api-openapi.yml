      x-docs-slug: context-management/get-project-group
    put:
      operationId: assignContextGroup
      summary: Assign a context group
      description: Assigns the group to the project at the lowest priority (201). If it's already assigned, nothing changes (200), and repeating it never moves a group that was reordered. Requires `org:context:write`.
      security:
      - BearerAuth: []
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Project ID.
        required: true
