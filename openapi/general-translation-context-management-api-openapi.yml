openapi: 3.2.0
info:
  title: General Translation Context Management API
  version: 2026-03-06.v1
  description: 'Translate content and manage projects with the General Translation API at `https://api.gtx.dev`.


    Authenticate with `Authorization: Bearer `. Each endpoint lists its required permissions. Project keys (`gtx-api-`) access one project; Organization keys (`gtx-org-`) access projects in one Organization.


    For project-scoped requests, use the project ID in the path. If you also send `gt-project-id`, it must match. Without a project ID in the path, project keys use their own project; Organization keys require `gt-project-id`. Discovery endpoints need no project ID. Organization-scoped requests use the Organization ID in the path. You must have access to the selected project or Organization.'
  contact:
    name: General Translation Support
    email: support@generaltranslation.com
    url: https://generaltranslation.com
servers:
- url: https://api.gtx.dev
  description: General Translation API
tags:
- name: Context Management
  description: Manage context groups, glossary terms, custom prompts, and project assignments.
paths:
  /v2/projects/{projectId}/context-groups:
    get:
      operationId: listProjectContextGroups
      summary: List project context groups
      description: Lists the groups assigned to the project, in priority order. Requires `org:context:read`. Omit `cursor` for the first page. When the response's `nextCursor` is a string, pass it as `cursor` to fetch the next page; when it is `null`, there are no more results.
      security:
      - BearerAuth: []
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 128
          description: Project ID.
        required: true
        description: Project ID.
        name: projectId
        in: path
      - schema:
          type: string
          minLength: 1
          description: The nextCursor from the previous page. Omit for the first page.
        required: false
        description: The nextCursor from the previous page. Omit for the first page.
        name: cursor
        in: query
      - schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
          description: Maximum number of items to return, 1–100. Defaults to 50.
        required: false
        description: Maximum number of items to return, 1–100. Defaults to 50.
        name: limit
        in: query
      - schema:
          $ref: '#/components/schemas/ApiVersion'
        required: false
        description: API contract version. Defaults to the oldest supported version.
        name: gt-api-version
        in: header
      responses:
        '200':
          description: Page of project context groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        groupId:
                          type: string
                        groupName:
                          type: string
                        priority:
                          type: integer
                          description: Lower values take precedence for duplicate terms.
                      required:
                      - groupId
                      - groupName
                      - priority
                  nextCursor:
                    type:
                    - string
                    - 'null'
                    description: Opaque cursor for the next page; `null` when there are no more items. Pages are read independently, so items changed between requests may be missed or repeated.
                required:
                - items
                - nextCursor
        '400':
          description: The request is malformed or failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '401':
          description: Authentication is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '403':
          description: The caller is authenticated but not allowed to perform this operation or access the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '404':
          description: The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '429':
          description: Too many requests. The rate limit was exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
      tags:
      - Context Management
      x-docs-slug: context-management/list-project-groups
