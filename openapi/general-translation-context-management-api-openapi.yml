          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: New group name, 1–255 characters.
                autoUpdate:
                  type: boolean
                  description: Whether translation runs may add terms and context to this group automatically.
              additionalProperties: false
