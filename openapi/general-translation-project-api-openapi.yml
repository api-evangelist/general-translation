  /v2/projects/{projectId}/api-keys:
    post:
      operationId: createProjectApiKey
      summary: Create a Project API Key
      description: Create a project API key. Requires `project:api_keys:write`; project keys cannot create other keys. If you cannot grant a selected permission, the request returns `403` without creating a key. Each successful request creates a new key. Store the returned secret securely.
      security:
      - BearerAuth: []
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 128
        required: true
        name: projectId
        in: path
      - schema:
          $ref: '#/components/schemas/ApiVersion'
        required: false
        description: API contract version. Defaults to the oldest supported version.
        name: gt-api-version
        in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 255
                  description: Key name, 1–255 characters after trimming.
                permissions:
                  type: array
                  items:
                    $ref: '#/components/schemas/ProjectApiKeyPermission'
                  minItems: 1
                  description: Project permissions to grant. Select at least one, or omit to grant all project permissions you can delegate. You must hold every selected permission. Duplicates are ignored. Write permissions do not include Read.
                type:
                  type: string
                  enum:
                  - production
                  - development
                  deprecated: true
                  description: Ignored. All new keys are project-scoped API keys for any environment.
              required:
              - name
              additionalProperties: false
      responses:
        '201':
          description: Project API key created
          content:
            application/json:
              schema:
                type: object
                properties:
                  apiKey:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      key:
                        type: string
                      projectId:
                        type: string
                      type:
                        type: string
                        enum:
                        - production
                        deprecated: true
                        description: Compatibility field. All project API keys work in any environment.
                    required:
                    - id
                    - name
                    - key
                    - projectId
                    - type
                required:
                - apiKey
        '400':
          description: The request is malformed or failed validation.
