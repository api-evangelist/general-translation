  /v2/project/assets:
    post:
      operationId: uploadAssets
      summary: Upload Project assets
      description: Upload OpenType or TrueType fonts for Lottie translations across your Organization. Uploading the same font family, weight, and italic style replaces the existing font. You can safely retry the full upload after a `500` response.
      security:
      - BearerAuth: []
      parameters:
      - schema:
          $ref: '#/components/schemas/ApiVersion'
        required: false
        description: API contract version. Defaults to the oldest supported version.
        name: gt-api-version
        in: header
      - schema:
          type: string
          description: Target project ID when no project ID is present in the path. Project API keys default to their bound project. If supplied, the header must match both the path target and the key’s bound project.
        required: false
        description: Target project ID when no project ID is present in the path. Project API keys default to their bound project. If supplied, the header must match both the path target and the key’s bound project.
        name: gt-project-id
        in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                assets:
                  type: array
                  items:
                    type: object
                    properties:
                      assetType:
                        type: string
                        enum:
                        - FONT
                      content:
                        type: string
                        minLength: 1
                      fileName:
                        type: string
                        minLength: 1
                        maxLength: 255
                        pattern: \.([tT][tT][fF]|[oO][tT][fF])$
                      family:
                        type: string
                        minLength: 1
                        maxLength: 255
                      style:
                        type: string
                        minLength: 1
                        maxLength: 100
                    required:
                    - assetType
                    - content
                    - fileName
                  minItems: 1
                  maxItems: 50
              required:
              - assets
      responses:
        '201':
          description: Uploaded assets
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        assetKey:
                          type: string
                        fileName:
                          type: string
                      required:
                      - id
                      - assetKey
                      - fileName
                  count:
                    type: integer
                    minimum: 0
                required:
                - assets
                - count
        '400':
          description: The request is malformed or failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '401':
