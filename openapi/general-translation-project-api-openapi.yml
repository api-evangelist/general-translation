openapi: 3.2.0
info:
  title: General Translation Project API
  version: 2026-03-06.v1
  description: 'Translate content and manage projects with the General Translation API at `https://api.gtx.dev`.


    Authenticate with `Authorization: Bearer `. Each endpoint lists its required permissions. Project keys (`gtx-api-`) access one project; Organization keys (`gtx-org-`) access projects in one Organization.


    For project-scoped requests, use the project ID in the path. If you also send `gt-project-id`, it must match. Without a project ID in the path, project keys use their own project; Organization keys require `gt-project-id`. Discovery endpoints need no project ID. Organization-scoped requests use the Organization ID in the path. You must have access to the selected project or Organization.'
  contact:
    name: General Translation Support
    email: support@generaltranslation.com
    url: https://generaltranslation.com
servers:
- url: https://api.gtx.dev
  description: General Translation API
tags:
- name: Project
  description: Create and manage projects, assets, branches, and file version tags.
paths:
  /v2/project/info/{projectId}:
    get:
      operationId: getProjectInfo
      summary: Get Project information
      description: Get a project's ID, name, Organization, locales, and auto-approval setting. No permission is needed beyond access to the project.
      security:
      - BearerAuth: []
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 128
        required: true
        name: projectId
        in: path
      - schema:
          $ref: '#/components/schemas/ApiVersion'
        required: false
        description: API contract version. Defaults to the oldest supported version.
        name: gt-api-version
        in: header
      - schema:
          type: string
          description: Target project ID when no project ID is present in the path. Project API keys default to their bound project. If supplied, the header must match both the path target and the key’s bound project.
        required: false
        description: Target project ID when no project ID is present in the path. Project API keys default to their bound project. If supplied, the header must match both the path target and the key’s bound project.
        name: gt-project-id
        in: header
      responses:
        '200':
          description: Project information
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  orgId:
                    type: string
                  defaultLocale:
                    type: string
                  currentLocales:
                    type: array
                    items:
                      type: string
                  autoApprove:
                    type: boolean
                required:
                - id
                - name
                - orgId
                - defaultLocale
                - currentLocales
                - autoApprove
        '400':
          description: The request is malformed or failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '401':
          description: Authentication is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '403':
          description: The caller is authenticated but not allowed to perform this operation or access the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '404':
          description: The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '429':
          description: Too many requests. The rate limit was exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
      tags:
      - Project
      x-docs-slug: project/project-info
    post:
      operationId: updateProjectInfo
      summary: Update Project information
      description: Update a project's default locale or CDN delivery setting. Requires `project:write`. Omitted settings remain unchanged.
      security:
      - BearerAuth: []
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 128
        required: true
        name: projectId
        in: path
      - schema:
          $ref: '#/components/schemas/ApiVersion'
        required: false
        description: API contract version. Defaults to the oldest supported version.
        name: gt-api-version
        in: header
      - schema:
          type: string
          description: Target project ID when no project ID is present in the path. Project API keys default to their bound project. If supplied, the header must match both the path target and the key’s bound project.
        required: false
        description: Target project ID when no project ID is present in the path. Project API keys default to their bound project. If supplied, the header must match both the path target and the key’s bound project.
        name: gt-project-id
        in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                defaultLocale:
                  type: string
                cdnEnabled:
                  type: boolean
      responses:
        '200':
          description: Project settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                required:
