openapi: 3.2.0
info:
  title: General Translation Files API
  version: 2026-03-06.v1
  description: 'Translate content and manage projects with the General Translation API at `https://api.gtx.dev`.


    Authenticate with `Authorization: Bearer `. Each endpoint lists its required permissions. Project keys (`gtx-api-`) access one project; Organization keys (`gtx-org-`) access projects in one Organization.


    For project-scoped requests, use the project ID in the path. If you also send `gt-project-id`, it must match. Without a project ID in the path, project keys use their own project; Organization keys require `gt-project-id`. Discovery endpoints need no project ID. Organization-scoped requests use the Organization ID in the path. You must have access to the selected project or Organization.'
  contact:
    name: General Translation Support
    email: support@generaltranslation.com
    url: https://generaltranslation.com
servers:
- url: https://api.gtx.dev
  description: General Translation API
tags:
- name: Files
  description: Upload, download, publish, move, and inspect project files.
paths:
  /v2/project/translations/files/status/{fileId}:
    get:
      operationId: getTranslationStatus
      summary: Get translation status for a file
      description: Return translation progress and availability by locale for one source file, along with its source metadata.
      security:
      - BearerAuth: []
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: fileId
        in: path
      - schema:
          type: string
        required: false
        name: versionId
        in: query
      - schema:
          type: string
        required: false
        name: branchId
        in: query
      - schema:
          $ref: '#/components/schemas/ApiVersion'
        required: false
        description: API contract version. Defaults to the oldest supported version.
        name: gt-api-version
        in: header
      - schema:
          type: string
          description: Target project ID when no project ID is present in the path. Project API keys default to their bound project. If supplied, the header must match both the path target and the key’s bound project.
        required: false
        description: Target project ID when no project ID is present in the path. Project API keys default to their bound project. If supplied, the header must match both the path target and the key’s bound project.
        name: gt-project-id
        in: header
      responses:
        '200':
          description: Translation status
          content:
            application/json:
              schema:
                type: object
                properties:
                  translations:
                    type: array
                    items:
                      type: object
                      properties:
                        locale:
                          type: string
                        completedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        approvedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        publishedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        createdAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                        updatedAt:
                          type:
                          - string
                          - 'null'
                          format: date-time
                      required:
                      - locale
                      - completedAt
                      - approvedAt
                      - publishedAt
                      - createdAt
                      - updatedAt
                  sourceFile:
                    type: object
                    properties:
                      id:
                        type: string
                      branchId:
                        type: string
                      fileId:
                        type: string
                      versionId:
                        type: string
                      fileName:
                        type: string
                      sourceLocale:
                        type: string
                      fileFormat:
                        $ref: '#/components/schemas/FileFormat'
                      dataFormat:
                        type:
                        - string
                        - 'null'
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
                      locales:
                        type: array
                        items:
                          type: string
                    required:
                    - id
                    - branchId
                    - fileId
                    - versionId
                    - fileName
                    - sourceLocale
                    - fileFormat
                    - dataFormat
                    - createdAt
                    - updatedAt
                    - locales
                required:
                - translations
                - sourceFile
        '400':
          description: The request is malformed or failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '401':
          description: Authentication is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '403':
          description: The caller is authenticated but not allowed to perform this operation or access the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '404':
          description: The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '429':
          description: Too many requests. The rate limit was exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
      tags:
      - Files
      x-docs-slug: files/translation-status
  /v2/project/files/diffs:
    post:
      operationId: submitUserEditDiffs
      summary: Submit translation diffs
      description: Overwrite translations with user-provided localized content.
      security:
      - BearerAuth: []
      parameters:
      - schema:
          $ref: '#/components/schemas/ApiVersion'
        required: false
        description: API contract version. Defaults to the oldest supported version.
        name: gt-api-version
        in: header
      - schema:
          type: string
          description: Target project ID when no project ID is present in the path. Project API keys default to their bound project. If supplied, the header must match both the path target and the key’s bound project.
        required: false
        description: Target project ID when no project ID is present in the path. Project API keys default to their bound project. If supplied, the header must match both the path target and the key’s bound project.
        name: gt-project-id
        in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: string
                diffs:
                  type: array
                  items:
                    type: object
                    properties:
                      locale:
                        type: string
                        minLength: 1
                      diff:
                        type: string
                      branchId:
                        type: string
                        minLength: 1
                      versionId:
                        type: string
                        minLength: 1
                      fileId:
                        type: string
                        minLength: 1
                      localContent:
                        type: string
                    required:
                    - locale
                    - diff
                    - versionId
                    - fileId
                    - localContent
                  minItems: 1
              required:
              - diffs
      responses:
        '200':
          description: Processed user translation edits
          content:
            application/json:
              schema:
                type: object
                properties:
                  filesProcessed:
                    type: integer
                    minimum: 0
                  entriesReceived:
                    type: integer
                    minimum: 0
                  message:
                    type: string
                required:
                - filesProcessed
                - entriesReceived
                - message
        '400':
          description: The request is malformed or failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '401':
          description: Authentication is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '403':
          description: The caller is authenticated but not allowed to perform this operation or access the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '413':
          description: The request, or the data it would return, exceeds a size or item limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '415':
          description: The request body's Content-Type is missing or not supported. Send the body as application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '429':
          description: Too many requests. The rate limit was exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
      tags:
      - Files
      x-docs-slug: files/submit-diffs
