                properties:
                  fileId:
                    type: string
                    minLength: 1
                  branchId:
                    type: string
                    minLength: 1
                  versionId:
                    type: string
                    minLength: 1
                  locale:
                    type: string
                    minLength: 1
                  useLatestAvailableVersion:
