                          type: integer
                        error:
                          type: string
                      required:
                      - oldFileId
                      - newFileId
                      - success
                  summary:
                    type: object
                    properties:
                      total:
                        type: integer
                        minimum: 0
                      succeeded:
                        type: integer
                        minimum: 0
