                      properties:
                        id:
                          type: string
                        branchId:
                          type: string
                        fileId:
                          type: string
                        versionId:
                          type: string
                        locale:
                          type: string
                        fileName:
                          type: string
                        data:
                          type: string
                        metadata:
                          $ref: '#/components/schemas/JsonObject'
                        fileFormat:
                          $ref: '#/components/schemas/FileFormat'
                      required:
                      - id
                      - branchId
                      - fileId
                      - versionId
                      - data
                      - metadata
                      - fileFormat
                  count:
