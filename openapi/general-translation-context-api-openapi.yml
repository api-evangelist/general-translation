openapi: 3.2.0
info:
  title: General Translation Context API
  version: 2026-03-06.v1
  description: 'Translate content and manage projects with the General Translation API at `https://api.gtx.dev`.


    Authenticate with `Authorization: Bearer `. Each endpoint lists its required permissions. Project keys (`gtx-api-`) access one project; Organization keys (`gtx-org-`) access projects in one Organization.


    For project-scoped requests, use the project ID in the path. If you also send `gt-project-id`, it must match. Without a project ID in the path, project keys use their own project; Organization keys require `gt-project-id`. Discovery endpoints need no project ID. Organization-scoped requests use the Organization ID in the path. You must have access to the selected project or Organization.'
  contact:
    name: General Translation Support
    email: support@generaltranslation.com
    url: https://generaltranslation.com
servers:
- url: https://api.gtx.dev
  description: General Translation API
tags:
- name: Context
  description: Generate translation context such as glossaries and instructions.
paths:
  /v2/project/setup/generate:
    post:
      operationId: generateProjectContext
      summary: Generate translation context
      description: Generate glossaries and translation instructions for the project.
      security:
      - BearerAuth: []
      parameters:
      - schema:
          $ref: '#/components/schemas/ApiVersion'
        required: false
        description: API contract version. Defaults to the oldest supported version.
        name: gt-api-version
        in: header
      - schema:
          type: string
          description: Target project ID when no project ID is present in the path. Project API keys default to their bound project. If supplied, the header must match both the path target and the key’s bound project.
        required: false
        description: Target project ID when no project ID is present in the path. Project API keys default to their bound project. If supplied, the header must match both the path target and the key’s bound project.
        name: gt-project-id
        in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: object
                    properties:
                      branchId:
                        type: string
                        minLength: 1
                      fileId:
                        type: string
                        minLength: 1
                      versionId:
                        type: string
                        minLength: 1
                    required:
                    - fileId
                    - versionId
                  minItems: 1
                locales:
                  type: array
                  items:
                    type: string
                force:
                  type: boolean
                  default: false
              required:
              - files
      responses:
        '200':
          description: Context generation status
          content:
            application/json:
              schema:
                anyOf:
                - type: object
                  properties:
                    status:
                      type: string
                      enum:
                      - completed
                  required:
                  - status
                - type: object
                  properties:
                    setupJobId:
                      type: string
                    status:
                      type: string
                      enum:
                      - queued
                  required:
                  - setupJobId
                  - status
        '400':
          description: The request is malformed or failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '401':
          description: Authentication is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '403':
          description: The caller is authenticated but not allowed to perform this operation or access the requested resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '404':
          description: The requested resource was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '413':
          description: The request, or the data it would return, exceeds a size or item limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '415':
          description: The request body's Content-Type is missing or not supported. Send the body as application/json.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '429':
          description: Too many requests. The rate limit was exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
        '500':
          description: An unexpected server error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
            text/html:
              schema:
                type: string
      tags:
      - Context
      x-docs-slug: context/generate-context
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
      - error
    ApiVersion:
      type: string
      enum:
      - 2025-01-01.v0
      - 2025-11-03.v1
      - 2026-02-18.v1
      - 2026-03-06.v1
      description: API contract version. Defaults to the oldest supported version.
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Project or organization API key.
