aid: general-translation
name: General Translation
description: >-
  General Translation is an end-to-end internationalization (i18n) and localization
  platform for developers, backed by a16z. It combines open-source i18n libraries for
  React, Next.js, React Native, Node.js, and Python with an AI-powered translation API,
  a context platform (glossaries and translation instructions), and Locadex, an AI
  coding agent that internationalizes source code and opens pull requests. The public
  REST API (api2.gtx.dev, plus the runtime host runtime2.gtx.dev) uploads source files,
  queues and downloads translations, manages branches and tags, reads project and job
  status, and translates content at runtime. It is used by developer-first teams
  including Cursor, Windsurf, Ramp, Mintlify, and ClickHouse.
